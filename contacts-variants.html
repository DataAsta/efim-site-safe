<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EFIM365 — варианты контактов</title>
    <link rel="icon" type="image/jpeg" href="Лого.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1e293b;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        .prev-section {
            padding: 60px 0;
            background: #fafafa;
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* =======================================================
           ОБЩАЯ СТРУКТУРА
           ======================================================= */
        .contact-footer-wrapper {
            position: relative;
            transition: background 0.4s ease;
        }

        .contact {
            padding: 80px 0 45px;
            color: white;
            position: relative;
        }
        .contact .section-title {
            color: white; font-size: 1.8rem; margin-bottom: 8px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .contact .section-sub {
            color: rgba(255, 255, 255, 0.92); font-size: 1rem; margin-bottom: 24px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .contact-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 60px;
            max-width: 900px;
            align-items: end;
        }
        .contact-col h3 {
            font-size: 1.2rem; font-weight: 600; margin-bottom: 16px;
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .contact-grid .contact-col:first-child h3 {
            display: none;
        }
        .contact-email {
            font-size: 1.2rem; font-weight: 600; color: white;
            margin-bottom: 16px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .contact-email a {
            color: white; text-decoration: none; transition: 0.2s;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            padding-bottom: 2px;
        }
        .contact-email a:hover {
            border-bottom-color: white;
        }
        .contact-links { display: flex; gap: 14px; flex-wrap: wrap; }

        .contact-links a {
            background: white;
            border: 2px solid white;
            padding: 10px 24px; border-radius: 40px; color: #1a1a1a;
            text-decoration: none; font-weight: 600; transition: 0.2s;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }
        .contact-links a:hover {
            background: #1a1a1a;
            border-color: #1a1a1a;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        .contact-logo-large {
            position: absolute;
            right: 62px;
            bottom: 20px;
            height: 160px;
            width: auto;
            border-radius: 20px;
            display: block;
            z-index: 5;
            box-shadow:
                0 -14px 40px rgba(0, 0, 0, 0.75),
                0 -4px 12px rgba(0, 0, 0, 0.6),
                0 24px 50px rgba(0, 0, 0, 0.55);
        }

        footer {
            padding: 50px 0 60px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            position: relative;
            z-index: 1;
        }
        .footer-inner {
            display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
            text-align: left;
        }
        .footer-name {
            color: white; font-weight: 600; font-size: 1rem;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .footer-legal {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        /* =======================================================
           ГРАДИЕНТНЫЕ ВАРИАНТЫ (V1–V6)
           ======================================================= */

        .contact-footer-wrapper.theme-v1 {
            background: linear-gradient(180deg,
                #fafafa 0%,
                #e8e8e8 3%,
                #c9c9c9 6%,
                #e53935 12%,
                #e53935 34%,
                #b71c1c 50%,
                #5a0a0a 65%,
                #0a0a0a 78%,
                #0a0a0a 100%);
        }

        .contact-footer-wrapper.theme-v2 {
            background: linear-gradient(180deg,
                #fafafa 0%,
                #ede0e0 2%,
                #e0a0a0 4%,
                #e53935 10%,
                #e53935 26%,
                #b71c1c 48%,
                #5a0a0a 68%,
                #0a0a0a 88%,
                #0a0a0a 100%);
        }

        .contact-footer-wrapper.theme-v3 {
            background: linear-gradient(180deg,
                #e8e8e8 0%,
                #e53935 5%,
                #e53935 25%,
                #b71c1c 50%,
                #5a0a0a 70%,
                #0a0a0a 88%,
                #0a0a0a 100%);
        }

        .contact-footer-wrapper.theme-v4 {
            background: linear-gradient(180deg,
                #0a0a0a 0%,
                #5a0a0a 18%,
                #b71c1c 34%,
                #e53935 50%,
                #b71c1c 66%,
                #5a0a0a 82%,
                #0a0a0a 100%);
        }

        .contact-footer-wrapper.theme-v5 {
            background: linear-gradient(180deg,
                #fafafa 0%,
                #ede0e0 2%,
                #e0a0a0 4%,
                #e53935 10%,
                #e53935 45%,
                #b71c1c 62%,
                #5a0a0a 78%,
                #0a0a0a 92%,
                #0a0a0a 100%);
        }

        .contact-footer-wrapper.theme-v6 {
            background:
                radial-gradient(ellipse at 50% 100%,
                    rgba(229, 57, 53, 0.85) 0%,
                    rgba(183, 28, 28, 0.6) 25%,
                    rgba(90, 10, 10, 0.3) 50%,
                    rgba(10, 10, 10, 0) 75%),
                linear-gradient(180deg,
                    #0a0a0a 0%,
                    #0a0a0a 100%);
        }

        /* =======================================================
           БЕЗ ГРАДИЕНТА (V7–V8)
           ======================================================= */

        /* V7 — Красный верх, весь низ с ИП — на чёрном */
        .contact-footer-wrapper.theme-v7 {
            background: linear-gradient(180deg,
                #e53935 0%,
                #e53935 62%,
                #0a0a0a 62%,
                #0a0a0a 100%);
        }

        /* V8 — Пополам: красный верх, чёрный низ */
        .contact-footer-wrapper.theme-v8 {
            background: linear-gradient(180deg,
                #e53935 0%,
                #e53935 50%,
                #0a0a0a 50%,
                #0a0a0a 100%);
        }

        /* =======================================================
           ПЕРЕКЛЮЧАТЕЛЬ
           ======================================================= */
        .theme-switcher {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            max-width: 300px;
        }
        .theme-switcher button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: 0.15s;
            white-space: nowrap;
        }
        .theme-switcher button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
        }
        .theme-switcher button.active {
            background: #e53935;
            border-color: #e53935;
            color: white;
        }
        .theme-switcher .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
            margin: 4px 2px;
        }

        @media (max-width: 992px) {
            .contact-grid { grid-template-columns: 1fr; gap: 30px; }
            .contact-logo-large {
                position: static;
                margin: 40px auto 0;
                height: 130px;
                box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
            }
            .footer-inner { align-items: center; text-align: center; }
        }
        @media (max-width: 600px) {
            .theme-switcher {
                left: 12px; right: 12px; bottom: 12px;
                max-width: none;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 8px;
            }
            .theme-switcher button {
                flex: 1 1 calc(50% - 6px);
                font-size: 0.72rem;
                padding: 8px 10px;
                text-align: center;
                white-space: normal;
            }
            .theme-switcher .divider {
                width: 100%;
                margin: 2px 0;
            }
            .contact-logo-large { height: 100px; }
        }
    </style>
</head>
<body>

    <div class="prev-section">
        ↑ здесь заканчивается секция «О Ефиме» — светлая
    </div>

    <div class="contact-footer-wrapper theme-v1" id="themeWrapper">

        <section class="contact" id="contact">
            <div class="container">
                <h2 class="section-title">Давайте обсудим ваш проект</h2>
                <p class="section-sub">Выберите удобный способ связи — ответим быстро и по делу.</p>
                <div class="contact-grid">
                    <div class="contact-col">
                        <h3>Контакты</h3>
                        <p class="contact-email">
                            <a href="mailto:efim365@yandex.ru">efim365@yandex.ru</a>
                        </p>
                        <div class="contact-links">
                            <a href="https://t.me/EFIM365?direct" target="_blank">Telegram</a>
                        </div>
                    </div>
                    <div class="contact-col">
                        <h3>Разбираем ELMA365</h3>
                        <div class="contact-links">
                            <a href="https://www.youtube.com/@efim365" target="_blank">YouTube</a>
                            <a href="https://rutube.ru/channel/42955504" target="_blank">Rutube</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <img src="Лого.jpg" alt="EFIM365" class="contact-logo-large" />

        <footer>
            <div class="container footer-inner">
                <span class="footer-name">ИП Загребин Ефим Игоревич</span>
                <span class="footer-legal">ИНН 183402706300</span>
                <span class="footer-legal">ОГРНИП 324180000087018</span>
            </div>
        </footer>

    </div>

    <div class="theme-switcher" id="themeSwitcher">
        <button data-theme="v1" class="active">V1. Текущий</button>
        <button data-theme="v2">V2. Красный → чёрный</button>
        <button data-theme="v3">V3. Лёгкий старт → красный</button>
        <button data-theme="v4">V4. Чёрный → красный → чёрный</button>
        <button data-theme="v5">V5. Много красного</button>
        <button data-theme="v6">V6. Тёмный с красным свечением</button>
        <div class="divider"></div>
        <button data-theme="v7">V7. Красный верх, ИП на чёрном</button>
        <button data-theme="v8">V8. Пополам</button>
    </div>

    <script>
        const wrapper = document.getElementById('themeWrapper');
        const buttons = document.querySelectorAll('.theme-switcher button');

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                wrapper.className = 'contact-footer-wrapper theme-' + btn.dataset.theme;
            });
        });
    </script>

</body>
</html>
